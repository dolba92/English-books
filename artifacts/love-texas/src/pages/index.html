<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />

    <title>English Books</title>

    <meta
      name="description"
      content="English Books — приложение для чтения книг на английском с переводом, словарём и тренировкой слов."
    />

    <meta name="robots" content="index, follow" />

    <!-- Цвет интерфейса браузера -->
    <meta name="theme-color" content="#f2d8df" />

    <!-- Новый логотип: иконки браузера -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />

    <!-- iPhone / iPad -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />

    <!-- PWA / Android -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:title" content="English Books" />
    <meta
      property="og:description"
      content="Читайте книги на английском, переводите слова и сохраняйте их в словарь."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="English Books" />
    <meta property="og:image" content="/logo-1024x1024.png" />

    <!-- Twitter / social preview -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="English Books" />
    <meta
      name="twitter:description"
      content="Читайте книги на английском, переводите слова и сохраняйте их в словарь."
    />
    <meta name="twitter:image" content="/logo-1024x1024.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
